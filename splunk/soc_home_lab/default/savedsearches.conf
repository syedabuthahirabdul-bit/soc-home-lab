[SOC Lab - Encoded PowerShell]
description = PowerShell started with -EncodedCommand / -enc (MITRE T1059.001, T1027).
search = `sysmon` EventCode=1 Image="*\\powershell.exe" (CommandLine="*-enc*" OR CommandLine="*-EncodedCommand*") \
| rex field=CommandLine "(?i)-e(nc(odedcommand)?)?\s+(?<encoded>[A-Za-z0-9+/=]{20,})" \
| table _time, host, User, ParentImage, Image, CommandLine, encoded
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.track = 1

[SOC Lab - Nmap Execution]
description = nmap.exe process creation seen by Sysmon (MITRE T1046 Network Service Discovery).
search = `sysmon` EventCode=1 Image="*\\nmap.exe" \
| table _time, host, User, ParentImage, CommandLine
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 3
alert.track = 1

[SOC Lab - Sysmon Event Volume]
description = Health check: Sysmon event counts by EventCode.
search = `sysmon` | stats count by EventCode | sort - count
dispatch.earliest_time = -24h
dispatch.latest_time = now
